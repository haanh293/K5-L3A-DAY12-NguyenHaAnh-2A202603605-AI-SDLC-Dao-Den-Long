name: CI Verify

on:
  push:
    branches: [main]
    tags: ['phase-*', 'v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run build
      - run: npm test
      - run: node scripts/verify-phase3.mjs
      - run: node --expose-gc scripts/soak.mjs --seed 7 --nights 10 --out tmp/soak-ci.json
      - run: node scripts/run-app.mjs --export-leaderboard tmp/lb-ci.json
